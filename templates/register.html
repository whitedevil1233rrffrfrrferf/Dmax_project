<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://kit.fontawesome.com/9fe3d1bfff.js" crossorigin="anonymous"></script>
  <script src="https://kit.fontawesome.com/9fe3d1bfff.js" crossorigin="anonymous"></script>
  <style>
    body {
      background-color: #f0f2f5;
      font-family: 'Roboto', sans-serif;
    }
    .form-signin {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      margin: 5rem auto;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .form-signin h1 {
      margin-bottom: 2rem;
      font-weight: 500;
    }
    .form-signin .form-control {
      margin-bottom: 1rem;
      border-radius: 5px;
      padding: 0.75rem;
      font-size: 1rem;
    }
    .form-signin .btn {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 5px;
      
      border: none;
    }
    .form-signin .btn-primary:hover {
      background-color: #0056b3;
    }
    .form-signin .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }
    .fade-out {
            opacity: 0;
            transition: opacity 1s ease-out;
        }
        label {
          color: #007bff;
          display: block;
          text-align: left;
          margin-left: 2.7rem;
          margin-bottom: 0.5rem; /* Add spacing below the label */
        }   
        
  </style>
</head>
<body>
  <form class="form-signin" action="{{url_for('register')}}" method="post" style=" text-align: center; margin: auto; padding:rem; background-color: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); margin-top:3%;">
    {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
              {% for category, message in messages %}
                  <div class="alert alert-{{ category }} flash-message" style="text-align: center; position: absolute; margin-left:2%;">{{ message }}</div>
              {% endfor %}
          {% endif %}
        {% endwith %}
    <h1 class="h3 mb-3 font-weight-normal" style="margin-bottom:2rem !important;">Register</h1>
    <div>
      <label for="username"  >Employee ID:</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="Employee ID" required="" autofocus="" fdprocessedid="3jwf2b" style="width:75%; margin-left: auto; margin-right: auto;">
      <label for="password"  >Password:</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Password" required="" fdprocessedid="ywi4nd" style="width: 75%;  margin-left: auto; margin-right: auto;">
      <label for="email" >Email:</label>
      <input for="email" id="email" name="email" class="form-control" placeholder="Email" required="" fdprocessedid="ywi4nd" style="width: 75%;  margin-left: auto; margin-right: auto;">
      <label for="name" >Name:</label>
      <input  id="name" name="name" class="form-control" placeholder="Name" required="" fdprocessedid="ywi4nd" style="width: 75%;  margin-left: auto; margin-right: auto;">
      <label for="role" >Role:</label>
      <select id="role" class="form-control" style="width: 75%;  margin-left: auto; margin-right: auto;" name="role" required>
        <option value="" disabled selected>Please select the role</option>
        <option value="admin">Approval Manager</option>
        <!-- <option value="super_admin">Super Admin</option> -->
        <option value="manager">Project Spocs</option>
        <option value="ad_m">ADM/DM</option>
        <option value="crewmate">QA Member</option>            
      </select>  
    <div style="display: flex; flex-direction: row ; justify-content: space-between;">
      <button class="btn btn-lg btn-primary btn-block" type="submit" fdprocessedid="lgl0q" style="margin-top:0.5rem; width: 7.3rem">Sign in</button>
      <a href="{{ url_for('sign') }}" class="btn btn-lg btn-secondary" style="margin-top:0.5rem; width: 7rem;">
        <i class="fa-solid fa-backward" style="margin-right: 1rem;"></i>Back
      </a>
    </div>
    </div>
    
  </form>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const flashMessages = document.querySelectorAll('.flash-message');
        setTimeout(() => {
            flashMessages.forEach(message => {
              message.classList.add('fade-out');
            });
        }, 1500); // 1 second delay before starting to fade out
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>  
</body>
</html>
