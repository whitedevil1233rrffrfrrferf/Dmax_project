<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
    <title>Document</title>
    <style>
        .flash-messages {
           
            
            transform: translateX(-50%);
            z-index: 1000;
        }
        .flash-message {
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid transparent;
            border-radius: 5px;
            
            text-align: center;
        }
        .flash-success {
            background-color: #d4edda;  /* Light green background color for success */
            color: #155724;  /* Dark green text color */
            border-color: #c3e6cb;  /* Light green border color */
        }
        .flash-error {
            background-color: #f8d7da;  /* Light red background color for error */
            color: #721c24;  /* Dark red text color */
            border-color: #f5c6cb;  /* Light red border color */
        }
    </style>
</head>
<body>
    <div style="display: flex;">
        {% include 'sidemenu.html'%}
    </div>
    <div class="container" style="width: 50rem;">
        <h1 style="text-align: center; margin-bottom:50px;" class="title">Profile</h1>
        
        
        <form  method="post" enctype="multipart/form-data">
            <!-- <div class="mb-3 " id="pic" style="display:none;">
                <label for="photo">Profile Picture:</label>
                <input type="file" class="form-control" id="photo" name="photo">
            </div> -->
            <center><i class="fa-solid fa-circle-user fa-10x"></i></center>
            <div class="mb-3">
                <label for="name">Name:</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ employee.name }}" readonly>
            </div>
            <div class="mb-3">
                <label for="name">Name:</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ employee.emp_id }}" readonly>
            </div>
            <div class="mb-3">
                <label for="name">Email:</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ employee.email }}" readonly>
            </div>
            <div class="mb-3">
                <label for="name">Role:</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ employee.role }}" readonly>
            </div>
            <!-- <div class="mb-3">
                <input type="checkbox" id="admin" name="role" value="admin" {{ 'checked' if role == 'admin' else '' }}>
                <label for="admin">Admin</label><br>
                <input type="checkbox" id="user" name="role" value="user" {{ 'checked' if role == 'user' else '' }}>
                <label for="user">User</label><br>
            </div> -->

           
            
        </form>
        
            
                <div style="margin-left:40%; margin-top: 2rem;">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            <div class="flash-messages">
                                {% for category, message in messages %}
                                    <div class="flash-message flash-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            </div>
                        {% endif %}
                    {% endwith %}
                </div>
            
            
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
</body>
</html>
