  <link rel="stylesheet" href="{{ url_for('static', filename='flash.css') }}">
  <style>
   body {
        background:url("{{ url_for('static', filename='login_background.jpg') }}");
    }
    .test{
        background-image:url("{{ url_for('static', filename='info_div.jpg') }}");
    }
    .form-signin {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      margin: 5rem auto;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .form-signin h1 {
      margin-bottom: 2rem;
      font-weight: 500;
    }
    .form-signin .form-control {
      margin-bottom: 1rem;
      border-radius: 5px;
      padding: 0.75rem;
      font-size: 1rem;
    }
    .form-signin .btn {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 5px;
      background-color: #007bff;
      border: none;
    }
    .form-signin .btn:hover {
      background-color: #0056b3;
    }
    .form-signin .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }
    .fade-out {
            opacity: 0;
            transition: opacity 1s ease-out;
        }
  </style>

  </script>

<body>
    <div style="display: flex; align-items: center; margin-left:23%; margin-top:5%;">
    <div style="height: 29rem; width: 22rem;margin-top:40px;" class="test">
      <img src="https://www.qaoncloud.com/public/assets/wp/wp-content/uploads/elementor/thumbs/QAonCloud.svg" title="QAonCloud Logo" alt="QAonCloud Logo" style="width:12rem;">
      <div class="content" style="margin-top: 40px; ">
         <h3 style="color: #fff; text-align: center;">Welcome</h3> 
         <h5 style="color: #fff;margin-top:50px; margin-left: 15%; line-height: 2.8;">Sign in to Track your goals and  monitor actual performance.</h5>
      </div>
    </div>
    <div>
      <form class="form-signin" action="{{url_for('sign')}}" method="post" style=" text-align: center; margin: auto; padding:rem; background-color: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); margin-top:10%; height: 29rem; width: 27rem;">
        
        <h1 class="h3 mb-3 font-weight-normal" style="margin-bottom:3rem !important;">Login</h1>
        <div>
          {% with messages = get_flashed_messages(with_categories=True) %}
                    {% if messages %}
                        <div id="flash-messages" style="margin-left: 10%;">
                            {% for category, message in messages %}
                                <div class="flash-message {{ category }}">
                                    <span>{{ message }}</span>
                                    <button class="close-btn" onclick="this.parentElement.style.display='none';">&times;</button>
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
          {% endwith %}
          </div>

        <div>
          <label for="username" class="sr-only">Employee ID :</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Employee ID" required="" autofocus="" fdprocessedid="3jwf2b" style="width:75%; margin-left: auto; margin-right: auto; margin-bottom: 2rem;">
          <label for="password" class="sr-only" >Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Password" required="" fdprocessedid="ywi4nd" style="width: 75%;  margin-left: auto; margin-right: auto;">
        
          <button class="btn btn-lg btn-primary btn-block" type="submit" fdprocessedid="lgl0q" style="margin-top: 3rem;">Login</button>
          
          <div style="display: flex; gap:2rem;">
            <a href="{{url_for('login')}}">
              <button class="btn btn-lg btn-primary btn-block" type="button"  fdprocessedid="lgl0q" style="margin-top: 3rem; font-size:14px; width:9.5rem;">Sign in with google</button>
            </a>
            <a href="{{url_for('register')}}">
              <button class="btn btn-lg btn-primary btn-block" type="button"  fdprocessedid="lgl0q" style="margin-top: 3rem;font-size:14px; width:9.5rem;">Register</button>
            </a>
          </div>
          
        </div>
        
      </form>
    </div>
