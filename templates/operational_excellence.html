<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/9fe3d1bfff.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>    
</head>
<body>
    <h1 class="text-center">Operational Excellence</h1>
    <div class="container mt-5 d-flex justify-content-center" >
        
        <div class="w-50">
            <form method="post" action="{{ url_for('operational_excellence', emp_id=emp_id) }}">
                <!-- <div class="mb-3">
                    <label for="attendance" class="form-label">Attendance</label>
                    <input type="number" class="form-control" id="attendance" name="attendance" required style="width: 300;">
                </div> -->
                <label for="month" class="form-label">Month</label>
                <select class="form-select mb-3" id="month" name="month" required>
                    <option value="" selected disabled>Please select a month</option>
                    {% for value, name in months_dict.items() %}
                        <option value="{{ value }}">{{ name }}</option>
                    {% endfor %}
                </select>
                <div class="mb-3">
                    <label for="dtouch" class="form-label">DTOUCH/Soft Skill</label>
                    <input type="number" class="form-control" id="dtouch" name="dtouch" required>
                </div>
                
                <div class="mb-3" >
                    <label for="newInitiatives" class="form-label">New Initiatives</label>
                    <input type="text" class="form-control" id="newInitiatives" name="newInitiatives" required >
                </div>
                <div style="display: flex; justify-content: space-around; margin-top:2rem;">
                    <button type="submit" class="btn btn-primary" style="width:6rem; height:3rem;"">Submit</button>
                    <a class="btn btn-outline-secondary" href="{{url_for('team_dmax_table')}}" style=" width:6rem; height:3rem;">
                        <div style="display: flex; justify-content: space-between; padding:5px;">
                            <div>
                                <i class="fa-solid fa-backward" style="margin-right: 10px; "></i>
                            </div>
                            <div>Back</div>
                        </div>
                    </a>
                </div>
                
            </form>
        </div>
        
    </div>   
    <!-- <div style="display: flex; margin-left: 30%; gap: 4rem;">
            
        <a class="btn btn-outline-secondary" href="{{url_for('view_dscore')}}" style=" padding:10px;width:6rem; height:3rem;">
            <div style="display: flex; justify-content: space-between; padding:5px;">
                <div>
                    <i class="fa-solid fa-backward" style="margin-right: 10px; "></i>
                </div>
                <div>Back</div>
            </div>
        </a>
    </div>  -->

</body>
</html>
