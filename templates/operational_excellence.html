<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operational Excellence</title>
    <link rel="icon" href="{{ url_for('static', filename='title_icons/opex_page.png') }}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/9fe3d1bfff.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>    
</head>
<body>
    <h1 class="text-center">Operational Excellence</h1>
    <div class="container mt-5 d-flex justify-content-center" >
        
        <div class="w-50">
            <form method="post" action="{{ url_for('operational_excellence', emp_id=emp_id) }}">
                <!-- <div class="mb-3">
                    <label for="attendance" class="form-label">Attendance</label>
                    <input type="number" class="form-control" id="attendance" name="attendance" required style="width: 300;">
                </div> -->
                <label for="month" class="form-label">Month</label>
                <select class="form-select mb-3" id="month" name="month" required>
                    <option value="" selected disabled>Please select a month</option>
                    {% for value, name in months_dict.items() %}
                        <option value="{{ value }}" >{{ name }}</option>
                    {% endfor %}
                </select>
                <label for="year" class="form-label">Year</label>
                <select class="form-select mb-3" id="year" name="year" required>
                    <option value="" selected disabled>Please select a year</option>
                    {% for year in years %}
                        <option value="{{ year }}" >
                            {{ year }}
                        </option>
                    {% endfor %}
                </select>
                <div class="mb-3">
                    <label for="dtouch" class="form-label">
                        DTOUCH/Soft Skill in %<span id="dtouch-description" class="text-muted" style="font-size: 0.9rem;"></span>
                    </label>
                    <input type="number" class="form-control" id="dtouch" name="dtouch"  required step="any" >
                </div>
                
                {% if not hide_new_initiatives %}
                    <div class="mb-3" >
                        <label for="newInitiatives" class="form-label">
                            New Initiatives in %<span id="newInitiatives-description" class="text-muted" style="font-size: 0.9rem;"></span>
                        </label>
                        <input type="number" class="form-control" id="newInitiatives" name="newInitiatives" required   step="any">
                    </div>
                {% endif %}    
                <div style="display: flex; justify-content: space-around; margin-top:2rem;">
                    <button type="submit" class="btn btn-primary" style="width:6rem; height:3rem;"">Submit</button>
                    <a class="btn btn-outline-secondary" href="{{url_for('view_dscore')}}" style=" width:6rem; height:3rem;">
                        <div style="display: flex; justify-content: space-between; padding:5px;">
                            <div>
                                <i class="fa-solid fa-backward" style="margin-right: 10px; "></i>
                            </div>
                            <div>Back</div>
                        </div>
                    </a>
                </div>
                
            </form>
        </div>
        
    </div>   
    <!-- <div style="display: flex; margin-left: 30%; gap: 4rem;">
            
        <a class="btn btn-outline-secondary" href="{{url_for('view_dscore')}}" style=" padding:10px;width:6rem; height:3rem;">
            <div style="display: flex; justify-content: space-between; padding:5px;">
                <div>
                    <i class="fa-solid fa-backward" style="margin-right: 10px; "></i>
                </div>
                <div>Back</div>
            </div>
        </a>
    </div>  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script> 
    <script>
        document.addEventListener("DOMContentLoaded", function () {
        const designation = "{{ emp_designation }}";  // Get designation from Jinja
        const dtouchInput = document.getElementById("dtouch");
        const dtouchDescription = document.getElementById("dtouch-description");    
        function updatePlaceholder() {
            let percentage = 5; // Default 5%
            
            if (["Intern", "Jr.QA Engineer"].includes(designation)) {
                percentage = 10; // 10% for Intern & JrQAEngineer
            }
            dtouchDescription.textContent = `(Max Weightage ${percentage}% )`;
    
            dtouchInput.min = 0;
            dtouchInput.max = percentage;
        }

        updatePlaceholder();

        
        }); 
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const designation = "{{ emp_designation }}";  // Get designation from Jinja
            const newInitiativesInput = document.getElementById("newInitiatives");
            const newInitiativesDescription = document.getElementById("newInitiatives-description");
    
            function updateNewInitiativesDescription() {
                let percentage = 0; // Default 0% for Intern & JrQAEngineer
    
                if (designation === "QA Engineer") {
                    percentage = 15;
                } else if (designation === "Sr.QA Engineer") {
                    percentage = 20;
                } else if (designation === "QA Lead") {
                    percentage = 30;
                }
    
                newInitiativesDescription.textContent = `(Max Weightage ${percentage}% )`;
                
                // If the value is 0 or empty, clear it to show placeholder
                newInitiativesInput.min = 0;
                newInitiativesInput.max = percentage;
            }
    
            updateNewInitiativesDescription();
        });
    </script>
    
    
</body>
</html>
